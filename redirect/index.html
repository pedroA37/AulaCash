<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AulaCash — Nos mudamos</title>
  <meta http-equiv="refresh" content="5;url=https://aula-cash-kappa.vercel.app" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #f1f5f9;
    }

    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 90%;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
      animation: bounce 1.6s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: .75rem;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    p strong {
      color: #e2e8f0;
    }

    .btn {
      display: inline-block;
      padding: .85rem 2.2rem;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
      box-shadow: 0 4px 20px rgba(99,102,241,.4);
    }

    .btn:hover {
      opacity: .9;
      transform: translateY(-2px);
    }

    .countdown {
      margin-top: 1.75rem;
      font-size: .85rem;
      color: #475569;
    }

    .countdown span {
      color: #818cf8;
      font-weight: 600;
    }

    .bar-wrap {
      margin-top: .75rem;
      height: 4px;
      background: #1e293b;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      border-radius: 99px;
      width: 100%;
      animation: shrink 5s linear forwards;
    }

    @keyframes shrink {
      from { width: 100%; }
      to   { width: 0%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🚀</span>
    <h1>¡Nos mudamos!</h1>
    <p>
      AulaCash tiene una nueva dirección.<br />
      Ahora vivimos en <strong>aula-cash-kappa.vercel.app</strong>
    </p>
    <a class="btn" href="https://aula-cash-kappa.vercel.app">Ir al nuevo sitio</a>
    <p class="countdown">Redirigiendo automáticamente en <span id="t">5</span> segundos…</p>
    <div class="bar-wrap"><div class="bar"></div></div>
  </div>

  <script>
    let s = 5;
    const el = document.getElementById('t');
    const iv = setInterval(() => {
      s--;
      el.textContent = s;
      if (s <= 0) {
        clearInterval(iv);
        location.href = 'https://aula-cash-kappa.vercel.app';
      }
    }, 1000);
  </script>
</body>
</html>
