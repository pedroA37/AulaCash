services:
  # ── BACKEND ──────────────────────────────────────────────
  - type: web
    name: aulacash-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false          # setear manualmente en el dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false          # URL del frontend (después del primer deploy)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
      - key: NODE_ENV
        value: production

  # ── LANDING ──────────────────────────────────────────────
  - type: web
    name: aulacash-landing
    runtime: static
    rootDir: landing
    staticPublishPath: .

  # ── FRONTEND (redirige al nuevo sitio en Vercel) ─────────
  - type: web
    name: aulacash-frontend
    runtime: static
    rootDir: redirect
    staticPublishPath: .
